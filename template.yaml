AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  RemedyAI - finds documented repair, card-benefit and consumer-law routes after a product
  fails, and re-checks its own primary sources daily (Source Watch).

Parameters:
  BedrockModelId:
    Type: String
    Default: us.amazon.nova-2-lite-v1:0
    Description: >-
      Vision-capable Bedrock model or inference profile that is ACTIVE in this region.
      Verified with a live Converse call on 2026-09-29. (anthropic.claude-3-5-sonnet-20240620-v1:0
      reached end-of-life on Bedrock on 2026-07-30.)
  BedrockFoundationModelId:
    Type: String
    Default: amazon.nova-2-lite-v1:0
    Description: >-
      The foundation model behind BedrockModelId (the inference profile id without its region
      prefix). Both are granted to the API; change them together.
  DailyAiCallLimit:
    Type: Number
    Default: 100  # worst case ~$1/day: Textract AnalyzeExpense is $0.01/page
    Description: Maximum Textract + Bedrock calls per UTC day from the public upload endpoint.
  PerClientDailyLimit:
    Type: Number
    Default: 10
    Description: >-
      Maximum photo reads per visitor per UTC day, so one visitor cannot use up the daily cap.
      Visitors are keyed by an HMAC of their IP with a random per-day key; raw IPs are not stored.
  AlertEmail:
    Type: String
    NoEcho: true
    Description: Email that receives the AWS Budgets alert.
  OriginVerifySecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: >-
      Random value CloudFront adds to every API request (X-Origin-Verify). The API refuses
      requests without it, so the API Gateway URL can't be used to bypass CloudFront.
  MonthlyBudgetUsd:
    Type: Number
    Default: 10

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    MemorySize: 1024
    Timeout: 29
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref StateTable
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        DAILY_AI_CALL_LIMIT: !Ref DailyAiCallLimit
        PER_CLIENT_DAILY_LIMIT: !Ref PerClientDailyLimit
        POWERTOOLS_SERVICE_NAME: remedyai

Resources:
  # ---------------------------------------------------------------------------
  # State: one table for Source Watch status and the daily AI-call counter
  # ---------------------------------------------------------------------------
  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  SnapshotBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  # ---------------------------------------------------------------------------
  # API: FastAPI on Lambda behind an HTTP API with throttling
  # ---------------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/lambda/  # produced by scripts/build_lambda.sh (arm64 wheels)
      Handler: src.lambda_handler.handler
      Description: RemedyAI API (evaluate, photo reading, claim PDF, sources)
      Environment:
        Variables:
          ORIGIN_VERIFY_SECRET: !Ref OriginVerifySecret
      Policies:
        - Statement:
            - Sid: ReceiptExtraction
              Effect: Allow
              Action: textract:AnalyzeExpense  # does not support resource-level scoping
              Resource: '*'
            - Sid: DefectPhotoAnalysis
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/${BedrockModelId}
                - !Sub arn:aws:bedrock:*::foundation-model/${BedrockFoundationModelId}
            # Item-level scoping: each statement names the keys it may touch, so the API can't
            # rewrite Source Watch's status and Source Watch can't touch the usage counters.
            - Sid: ReadSourceStatusAndDailyKeys
              Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt StateTable.Arn
              Condition:
                ForAllValues:StringLike:
                  dynamodb:LeadingKeys: ['sourcewatch#latest', 'salt#*']
            - Sid: CreateDailyKey
              Effect: Allow
              Action: dynamodb:PutItem  # conditional, first writer wins
              Resource: !GetAtt StateTable.Arn
              Condition:
                ForAllValues:StringLike:
                  dynamodb:LeadingKeys: ['salt#*']
            - Sid: DailyCounters
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt StateTable.Arn
              Condition:
                ForAllValues:StringLike:
                  dynamodb:LeadingKeys: ['usage#*', 'client#*', 'pdfusage#*', 'pdfclient#*']
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApiFunction}
      RetentionInDays: 14

  # ---------------------------------------------------------------------------
  # Source Watch: daily re-check of every primary source
  # ---------------------------------------------------------------------------
  SourceWatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/lambda/
      Handler: src.services.source_watch.handler
      Description: Re-checks every primary source and Apple's service-program index
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          SNAPSHOT_BUCKET: !Ref SnapshotBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem]
              Resource: !GetAtt StateTable.Arn
              Condition:
                ForAllValues:StringLike:
                  dynamodb:LeadingKeys: ['sourcewatch#latest']
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub ${SnapshotBucket.Arn}/snapshots/*
      Events:
        Daily:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 6 * * ? *)
            ScheduleExpressionTimezone: UTC

  SourceWatchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${SourceWatchFunction}
      RetentionInDays: 30

  # Emails the owner if the daily check fails or doesn't run. The API already treats a missing or
  # out-of-date check as "unverified"; this makes sure a person notices and fixes it.
  OpsAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: RemedyAI alerts
      KmsMasterKeyId: alias/aws/sns
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  OpsAlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref OpsAlertTopic]
      PolicyDocument:
        Statement:
          - Sid: CloudWatchAlarms
            Effect: Allow
            Principal: { Service: cloudwatch.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref OpsAlertTopic
            Condition:
              ArnLike: { aws:SourceArn: !Sub 'arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:*' }

  SourceWatchErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The daily Source Watch run failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref SourceWatchFunction }]
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertTopic]

  SourceWatchMissedRunAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      # Two whole UTC days without a run (the schedule runs once a day at 06:00).
      AlarmDescription: Source Watch has missed its daily run.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions: [{ Name: FunctionName, Value: !Ref SourceWatchFunction }]
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref OpsAlertTopic]

  # ---------------------------------------------------------------------------
  # Frontend: private S3 bucket + one CloudFront distribution for site and API
  # ---------------------------------------------------------------------------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-site-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${AWS::StackName}-security-headers
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
            Override: true

  # Forwards only what the API needs, plus CloudFront-Viewer-Address (set by CloudFront, so a client
  # cannot spoof it) for the per-visitor cap. The Host header is not forwarded (API Gateway needs its own).
  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub ${AWS::StackName}-api-origin
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers: [Content-Type, Accept, CloudFront-Viewer-Address]
        CookiesConfig:
          CookieBehavior: none
        QueryStringsConfig:
          QueryStringBehavior: all

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: RemedyAI site and API
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api
            DomainName: !Sub ${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref OriginVerifySecret
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # Managed-CachingDisabled
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref SecurityHeaders
          - PathPattern: /health
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref SecurityHeaders

  # ---------------------------------------------------------------------------
  # Cost guard
  # ---------------------------------------------------------------------------
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub ${AWS::StackName}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  SiteUrl:
    Description: Public URL (site and API on one origin)
    Value: !Sub https://${Distribution.DomainName}
  DistributionId:
    Value: !Ref Distribution
  SiteBucketName:
    Value: !Ref SiteBucket
  SnapshotBucketName:
    Value: !Ref SnapshotBucket
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  SourceWatchFunctionName:
    Value: !Ref SourceWatchFunction
