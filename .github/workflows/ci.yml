name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt pip-audit==2.9.0
      - name: Test
        run: python -m pytest tests -q
      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend build and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev

  template:
    name: SAM template lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Lint template.yaml
        run: pip install cfn-lint==1.* && cfn-lint template.yaml
